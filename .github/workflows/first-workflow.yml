name: First-workflow
on: pull_request
permissions:
  contents: read
jobs:
  setup-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect node version
        run: node --version
